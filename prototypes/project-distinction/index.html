<!doctype html>
<!--
  PROTOTYPE — 버려도 되는 코드. 질문: "목록에서 프로젝트와 메모를 어떻게 다르게 보이게 할까?"
  6개 시안을 ?variant=1..6 으로 전환(하단 바 · ←/→ 키). 실제 목록 창(440×600)과 같은 데이터·토큰으로 비교한다.
  결정된 안만 frontend/features/library 로 옮기고 이 폴더는 버린다.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE · 프로젝트/메모 구분</title>
<style>
:root { color-scheme: light dark; }
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
:root {
  --bg: light-dark(#f5f5f7, #1a1b1e);
  --surface: light-dark(#fff, #26272b);
  --raised: light-dark(#fff, #2e2f34);
  --text: light-dark(#1d1d1f, #f2f2f4);
  --muted: light-dark(#636366, #a5a7ae);
  --hairline: light-dark(rgba(0,0,0,.09), rgba(255,255,255,.1));
  --accent: light-dark(#0a6cff, #1f6fe5);
  --success: light-dark(#1f9d5c, #35b673);
  --shadow: light-dark(rgba(27,34,48,.1), rgba(0,0,0,.28));
  --yellow: #e0b030; --blue: #5b8def; --green: #4caf6a; --pink: #e06b8f;
  font-family: "Noto Sans KR", "Pretendard", system-ui, sans-serif; font-size: 13px;
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: start center; gap: 16px; padding: 24px 16px 96px; background: light-dark(#dcdde2, #0d0e10); color: var(--text); }
.note-box { max-width: 440px; width: 100%; color: var(--muted); font-size: 12px; line-height: 1.5; }
.note-box b { color: var(--text); }
/* 창 */
.window { width: min(440px, 100%); height: 600px; overflow: hidden auto; border-radius: 14px; background: var(--bg); box-shadow: 0 0 0 1px var(--hairline), 0 12px 40px var(--shadow); scrollbar-width: none; }
.header { position: sticky; top: 0; z-index: 2; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 46px; padding: 4px 12px; background: var(--bg); }
.header .ctl { display: flex; gap: 14px; color: var(--muted); font-size: 15px; }
.header .title { font-weight: 600; font-size: 14px; }
.header .act { justify-self: end; display: flex; gap: 6px; align-items: center; }
.new { border: 0; border-radius: 9px; padding: 6px 12px 6px 8px; color: #fff; background: var(--accent); font: inherit; font-weight: 600; }
.search { margin: 8px 20px 0; height: 32px; border-radius: 9px; background: color-mix(in srgb, var(--text) 5.5%, transparent); display: flex; align-items: center; padding: 0 10px; color: var(--muted); font-size: 12px; }
.count { display: flex; justify-content: space-between; align-items: center; margin: 14px 20px 8px; color: var(--muted); font-size: 11px; }
.seg { display: flex; padding: 2px; border-radius: 8px; background: color-mix(in srgb, var(--text) 6%, transparent); }
.seg span { padding: 3px 9px; border-radius: 6px; }
.seg span:first-child { background: var(--surface); color: var(--text); font-weight: 600; }
.list { display: flex; flex-direction: column; gap: 8px; padding: 0 20px 20px; }
button { font: inherit; color: inherit; }
.icon { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.more { color: var(--muted); padding: 0 4px; letter-spacing: 1px; }
.chip { padding: 1px 7px; border-radius: 999px; color: var(--muted); background: color-mix(in srgb, var(--text) 7%, transparent); font-size: 10px; font-weight: 400; }
.preview { color: var(--muted); font-size: 12px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.bar { height: 3px; border-radius: 999px; background: color-mix(in srgb, var(--text) 8%, transparent); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--success); border-radius: inherit; }
.sub { color: var(--muted); font-size: 11px; }
.expander { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 240ms cubic-bezier(.33,1,.68,1); }
.expander.open { grid-template-rows: 1fr; }
.expander > div { min-height: 0; overflow: hidden; }

/* 공통 메모 카드(모든 시안에서 그대로) */
.memo { display: flex; gap: 10px; padding: 12px 12px 12px 14px; border-radius: 12px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--hairline); }
.memo .stripe { width: 3px; border-radius: 3px; flex: none; background: var(--c); }
.memo .body { flex: 1; min-width: 0; display: grid; gap: 4px; }
.memo .t { display: flex; gap: 8px; align-items: center; font-weight: 600; font-size: 14px; }
.memo .t span:first-child { flex: 1; }

/* ---------- 1. 폴더 탭 ---------- */
.v1 .proj { position: relative; margin-top: 10px; padding: 12px 12px 10px 14px; border-radius: 4px 12px 12px 12px; background: color-mix(in srgb, var(--c) 10%, var(--surface)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 30%, var(--hairline)); }
.v1 .proj::before { content: ""; position: absolute; left: 0; top: -9px; width: 96px; height: 10px; border-radius: 6px 10px 0 0; background: inherit; box-shadow: inset 1px 1px 0 color-mix(in srgb, var(--c) 30%, var(--hairline)), inset -1px 0 0 color-mix(in srgb, var(--c) 30%, var(--hairline)); clip-path: inset(0 0 1px 0); }
.v1 .head { display: flex; gap: 8px; align-items: center; font-weight: 600; font-size: 14px; }
.v1 .head .name { flex: 1; }
.v1 .meta { display: flex; gap: 8px; align-items: center; margin: 6px 0 2px; }
.v1 .meta .bar { flex: 1; }
.v1 .kids { display: grid; gap: 6px; padding-top: 10px; }
.v1 .kids .memo { box-shadow: none; }

/* ---------- 2. 겹친 종이 더미 ---------- */
.v2 .proj { position: relative; margin-bottom: calc(var(--depth) * 4px); }
.v2 .sheet { position: absolute; inset: 0; border-radius: 12px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--hairline), 0 1px 2px var(--shadow); transition: transform 240ms cubic-bezier(.33,1,.68,1), opacity 240ms; }
.v2 .sheet.s1 { transform: translate(4px, 4px) rotate(.6deg); opacity: .85; }
.v2 .sheet.s2 { transform: translate(8px, 8px) rotate(1.2deg); opacity: .6; }
.v2 .proj.open .sheet.s1, .v2 .proj.open .sheet.s2 { transform: none; opacity: 0; }
.v2 .card { position: relative; padding: 12px 12px 12px 14px; border-radius: 12px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--hairline), 0 2px 6px var(--shadow); }
.v2 .head { display: flex; gap: 8px; align-items: center; font-weight: 600; font-size: 14px; }
.v2 .head .folder { color: var(--c); }
.v2 .head .name { flex: 1; }
.v2 .meta { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
.v2 .meta .bar { flex: 1; }
.v2 .kids { display: grid; gap: 6px; padding-top: 10px; }
.v2 .kids .memo { background: color-mix(in srgb, var(--text) 3%, var(--surface)); box-shadow: none; }

/* ---------- 3. 헤더형 섹션 ---------- */
.v3 .list { gap: 4px; }
.v3 .proj { margin-top: 10px; }
.v3 .head { display: grid; grid-template-columns: auto 1fr auto auto; gap: 8px; align-items: center; padding: 6px 2px 8px; border-bottom: 2px solid var(--c); }
.v3 .head .name { font-weight: 700; font-size: 15px; }
.v3 .head .bar { grid-column: 1 / -1; }
.v3 .kids { display: grid; gap: 6px; padding-top: 8px; }
.v3 .kids .proj { margin-top: 2px; }
.v3 .kids .proj .head { border-bottom-width: 1px; }
.v3 .kids .proj .head .name { font-size: 13px; }

/* ---------- 4. 진행 링 배지 ---------- */
.v4 .proj { padding: 10px 12px; border-radius: 12px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--hairline); }
.v4 .head { display: flex; gap: 10px; align-items: center; }
.v4 .ring { --p: 0; position: relative; width: 36px; height: 36px; flex: none; border-radius: 50%; background: conic-gradient(var(--success) calc(var(--p) * 1%), color-mix(in srgb, var(--text) 10%, transparent) 0); display: grid; place-items: center; }
.v4 .ring::after { content: attr(data-n); position: absolute; inset: 4px; display: grid; place-items: center; border-radius: 50%; background: color-mix(in srgb, var(--c) 18%, var(--surface)); font-size: 12px; font-weight: 700; }
.v4 .head .info { flex: 1; display: grid; gap: 2px; }
.v4 .head .name { font-weight: 600; font-size: 14px; }
.v4 .kids { display: grid; gap: 6px; padding-top: 10px; }
.v4 .kids .memo, .v4 .kids .proj { box-shadow: none; background: color-mix(in srgb, var(--text) 3%, var(--surface)); }

/* ---------- 5. 레일 연결선 ---------- */
.v5 .proj { padding: 12px 12px 12px 14px; border-radius: 12px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--hairline); }
.v5 .head { display: flex; gap: 8px; align-items: center; font-weight: 600; font-size: 14px; }
.v5 .head .name { flex: 1; }
.v5 .meta { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
.v5 .meta .bar { flex: 1; }
.v5 .kids { position: relative; display: grid; gap: 6px; margin: 10px 0 0 6px; padding-left: 16px; }
.v5 .kids::before { content: ""; position: absolute; left: 0; top: 0; bottom: 18px; width: 2px; border-radius: 2px; background: color-mix(in srgb, var(--c) 60%, transparent); }
.v5 .kids > * { position: relative; }
.v5 .kids > *::before { content: ""; position: absolute; left: -16px; top: 18px; width: 12px; height: 2px; background: color-mix(in srgb, var(--c) 60%, transparent); }
.v5 .kids .memo, .v5 .kids .proj { box-shadow: inset 0 0 0 1px var(--hairline); padding-left: 12px; }
.v5 .kids .proj { padding: 10px 10px 10px 12px; }

/* ---------- 6. 추천: 종이 더미 + 레일 ---------- */
.v6 .proj { position: relative; margin-bottom: calc(var(--depth) * 4px); }
.v6 .sheet { position: absolute; left: 0; right: 0; top: 0; height: 100%; max-height: 92px; border-radius: 12px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--hairline); transition: transform 240ms cubic-bezier(.33,1,.68,1), opacity 200ms; }
.v6 .sheet.s1 { transform: translateY(4px) scaleX(.97); opacity: .9; }
.v6 .sheet.s2 { transform: translateY(8px) scaleX(.93); opacity: .65; }
.v6 .proj.open .sheet { transform: none; opacity: 0; }
.v6 .card { position: relative; padding: 12px 12px 10px 12px; border-radius: 12px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--hairline), 0 2px 6px var(--shadow); }
.v6 .head { display: flex; gap: 8px; align-items: center; font-weight: 600; font-size: 14px; }
.v6 .folder { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; color: var(--c); background: color-mix(in srgb, var(--c) 16%, transparent); }
.v6 .head .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.v6 .meta { display: flex; gap: 8px; align-items: center; margin: 6px 0 0 34px; }
.v6 .meta .bar { flex: 1; }
.v6 .toggle { display: flex; align-items: center; gap: 4px; margin: 6px 0 0 34px; padding: 0; border: 0; background: none; color: var(--muted); font-size: 11px; cursor: pointer; }
.v6 .toggle .icon { width: 12px; height: 12px; transition: transform 200ms; }
.v6 .proj.open > .card > .toggle .icon { transform: rotate(90deg); }
.v6 .kids { position: relative; display: grid; gap: 6px; margin: 8px 0 2px 12px; padding-left: 14px; }
.v6 .kids::before { content: ""; position: absolute; left: 0; top: 2px; bottom: 18px; width: 2px; border-radius: 2px; background: color-mix(in srgb, var(--c) 55%, transparent); }
.v6 .kids > * { position: relative; }
.v6 .kids > *::before { content: ""; position: absolute; left: -14px; top: 18px; width: 10px; height: 2px; border-radius: 2px; background: color-mix(in srgb, var(--c) 55%, transparent); }
.v6 .kids .card { box-shadow: inset 0 0 0 1px var(--hairline); }
.v6 .kids .memo { box-shadow: inset 0 0 0 1px var(--hairline); }

/* 하단 전환 바 */
.switcher { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 999px; background: #111; color: #fff; box-shadow: 0 8px 30px rgba(0,0,0,.35); font-size: 12px; z-index: 10; max-width: calc(100vw - 32px); }
#nums { display: inline-flex; gap: 2px; }
.switcher button { border: 0; border-radius: 999px; padding: 6px 10px; background: transparent; color: #fff; cursor: pointer; white-space: nowrap; }
.switcher button.on { background: #fff; color: #111; font-weight: 600; }
.switcher .label { padding: 0 8px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 520px) { .switcher .label { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<p class="note-box" id="desc"></p>
<div class="window" id="win"></div>
<nav class="switcher" aria-label="시안 전환">
  <button id="prev" aria-label="이전 시안">←</button>
  <span id="nums"></span>
  <button id="next" aria-label="다음 시안">→</button>
  <span class="label" id="label"></span>
  <button id="theme" aria-label="테마 전환">◐</button>
</nav>
<script>
// 실제 visual-fixture 구조를 본뜬 합성 데이터: 프로젝트 2단 중첩 + 단독 메모
const data = [
  { kind: 'project', id: 'p1', title: '아이디어를 모으고', color: 'yellow', done: 2, total: 3, open: true, children: [
    { kind: 'project', id: 'p2', title: '생각을 연결하고', color: 'blue', done: 2, total: 3, open: false, children: [
      { kind: 'memo', title: '하나씩 완성하기', color: 'green', preview: '아이디어 기록하기 · 메모 사이 연결 만들기', chip: '2/3' },
    ] },
    { kind: 'memo', title: '회의 메모', color: 'yellow', preview: '다음 주까지 초안 공유, 캔버스 정리는 금요일.' },
  ] },
  { kind: 'memo', title: '오늘의 작은 기록', color: 'pink', preview: '여유롭게, 내 속도로 중요한 생각은 남기고, 다음에 할 일을 정리합니다.' },
  { kind: 'project', id: 'p3', title: '여행 준비', color: 'green', done: 0, total: 0, open: false, children: [
    { kind: 'memo', title: '짐 목록', color: 'green', preview: '여권, 충전기, 우산' },
    { kind: 'memo', title: '숙소 후보', color: 'green', preview: '역 근처 두 곳 비교' },
    { kind: 'memo', title: '일정', color: 'green', preview: '첫날 오후 도착' },
  ] },
];
const variants = [
  { n: 1, name: '폴더 탭', desc: '프로젝트 카드 위에 서류철 탭. 메모 색을 옅게 깐 바탕으로 "묶음"을 표시.' },
  { n: 2, name: '겹친 종이 더미', desc: '접힌 프로젝트 뒤에 종이 1~2장이 비껴 쌓임(하위 수만큼). 펼치면 더미가 풀림.' },
  { n: 3, name: '헤더형 섹션', desc: '프로젝트는 카드가 아닌 굵은 구획 머리글 + 색 밑줄. 하위 메모가 바로 아래 이어짐.' },
  { n: 4, name: '진행 링 배지', desc: '프로젝트 앞에 진행률 링 + 하위 개수. 메모 앞에는 아무것도 없음.' },
  { n: 5, name: '레일 연결선', desc: '펼친 프로젝트 하위를 세로 레일에 매달아 단계 표시. 상자 안 상자 제거.' },
  { n: 6, name: '추천: 더미 + 레일', desc: '접힘: 폴더 아이콘 + 종이 더미로 "그릇". 펼침: 레일로 소속. 펼침 제어는 "메모 N개 ›" 한 곳.' },
];
const ICON = {
  folder: '<svg class="icon" viewBox="0 0 16 16"><path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h2.6l1.4 1.5h5A1.5 1.5 0 0 1 14 6v5.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5z"/></svg>',
  enter: '<svg class="icon" viewBox="0 0 16 16"><path d="M6 3H3.5v9.5H13V10M9 3h4v4M13 3 7.5 8.5"/></svg>',
  chev: '<svg class="icon" viewBox="0 0 16 16"><path d="m6 4 4 4-4 4"/></svg>',
  down: '<svg class="icon" viewBox="0 0 16 16"><path d="m4 6 4 4 4-4"/></svg>',
};
const color = (c) => `--c: var(--${c})`;
const count = (p) => p.children.length;
const bar = (p) => p.total ? `<span class="bar"><i style="width:${p.done / p.total * 100}%"></i></span>` : '';
const chip = (p) => p.total ? `<span class="chip">${p.done}/${p.total}</span>` : '';
const memo = (m) => `<div class="memo" style="${color(m.color)}"><span class="stripe"></span><div class="body"><div class="t"><span>${m.title}</span>${m.chip ? `<span class="chip">${m.chip}</span>` : ''}<span class="more">···</span></div><div class="preview">${m.preview}</div></div></div>`;
const kids = (p, v) => `<div class="expander${p.open ? ' open' : ''}"><div><div class="kids">${p.children.map((c) => item(c, v)).join('')}</div></div></div>`;
const downToggle = (p) => `<button class="toggle-down" data-id="${p.id}" style="display:block;margin:6px auto 0;border:0;background:none;color:var(--muted);cursor:pointer;transform:rotate(${p.open ? 180 : 0}deg);transition:transform 200ms">${ICON.down}</button>`;

const render = {
  1: (p) => `<div class="proj" style="${color(p.color)}"><div class="head">${ICON.folder}<span class="name">${p.title}</span>${chip(p)}<span class="more">···</span></div><div class="meta"><span class="sub">메모 ${count(p)}개</span>${bar(p)}</div>${kids(p, 1)}${downToggle(p)}</div>`,
  2: (p) => `<div class="proj${p.open ? ' open' : ''}" style="${color(p.color)};--depth:${Math.min(2, count(p))}">${count(p) > 1 ? '<span class="sheet s2"></span>' : ''}<span class="sheet s1"></span><div class="card"><div class="head"><span class="folder">${ICON.folder}</span><span class="name">${p.title}</span>${chip(p)}<span class="more">···</span></div><div class="meta"><span class="sub">메모 ${count(p)}개</span>${bar(p)}</div>${kids(p, 2)}${downToggle(p)}</div></div>`,
  3: (p) => `<section class="proj" style="${color(p.color)}"><div class="head"><span style="color:var(--c)">${ICON.folder}</span><span class="name">${p.title}</span><span class="sub">${count(p)}개 ${chip(p)}</span><button class="toggle-down" data-id="${p.id}" style="border:0;background:none;color:var(--muted);cursor:pointer;transform:rotate(${p.open ? 180 : 0}deg);transition:transform 200ms">${ICON.down}</button>${bar(p)}</div>${kids(p, 3)}</section>`,
  4: (p) => `<div class="proj" style="${color(p.color)}"><div class="head"><span class="ring" style="--p:${p.total ? p.done / p.total * 100 : 0}" data-n="${count(p)}"></span><div class="info"><span class="name">${p.title}</span><span class="sub">${p.total ? `할 일 ${p.done}/${p.total}` : '할 일 없음'} · 메모 ${count(p)}개</span></div><span class="more">···</span></div>${kids(p, 4)}${downToggle(p)}</div>`,
  5: (p) => `<div class="proj" style="${color(p.color)}"><div class="head">${ICON.folder}<span class="name">${p.title}</span>${chip(p)}<span class="more">···</span></div><div class="meta"><span class="sub">메모 ${count(p)}개</span>${bar(p)}</div>${kids(p, 5)}${downToggle(p)}</div>`,
  6: (p) => `<div class="proj${p.open ? ' open' : ''}" style="${color(p.color)};--depth:${Math.min(2, count(p))}">${count(p) > 1 ? '<span class="sheet s2"></span>' : ''}<span class="sheet s1"></span><div class="card"><div class="head"><span class="folder">${ICON.folder}</span><span class="name">${p.title}</span>${chip(p)}<span class="more" title="캔버스에서 열기">${ICON.enter}</span><span class="more">···</span></div>${p.total ? `<div class="meta">${bar(p)}</div>` : ''}<button class="toggle" data-id="${p.id}" aria-expanded="${p.open}">${ICON.chev}메모 ${count(p)}개</button>${kids(p, 6)}</div></div>`,
};
function item(node, v) { return node.kind === 'memo' ? memo(node) : render[v](node); }
function find(list, id) { for (const n of list) { if (n.id === id) return n; if (n.children) { const f = find(n.children, id); if (f) return f; } } }

let current = Math.min(6, Math.max(1, Number(new URLSearchParams(location.search).get('variant')) || 6));
function draw() {
  const v = variants[current - 1];
  const memos = 6, projects = 3;
  document.getElementById('win').className = `window v${current}`;
  document.getElementById('win').innerHTML = `<div class="header"><div class="ctl">✕ ─ ▢</div><div class="title">MemoIvy</div><div class="act"><button class="new">＋ New</button></div></div><div class="search">메모 검색</div><div class="count"><span>메모 ${memos}개 · 프로젝트 ${projects}개</span><span class="seg"><span>프로젝트별</span><span>최근</span></span></div><div class="list">${data.map((n) => item(n, current)).join('')}</div>`;
  document.getElementById('desc').innerHTML = `<b>${v.n}. ${v.name}</b> — ${v.desc}<br>프로젝트를 눌러 펼치기·접기. ←/→ 시안, ◐ 테마.`;
  document.getElementById('label').textContent = `${v.n}. ${v.name}`;
  document.getElementById('nums').innerHTML = variants.map((x) => `<button class="${x.n === current ? 'on' : ''}" data-v="${x.n}">${x.n}</button>`).join('');
  const url = new URL(location.href); url.searchParams.set('variant', current); history.replaceState(null, '', url);
}
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-id]'); if (t) { const p = find(data, t.dataset.id); p.open = !p.open; draw(); return; }
  const head = e.target.closest('.proj .head'); if (head && current !== 6) { const btn = head.closest('.proj').querySelector('[data-id]'); if (btn) { const p = find(data, btn.dataset.id); p.open = !p.open; draw(); } return; }
  const n = e.target.closest('[data-v]'); if (n) { current = Number(n.dataset.v); draw(); }
});
document.getElementById('prev').onclick = () => { current = current === 1 ? 6 : current - 1; draw(); };
document.getElementById('next').onclick = () => { current = current === 6 ? 1 : current + 1; draw(); };
document.getElementById('theme').onclick = () => { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; };
document.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') document.getElementById('prev').click(); if (e.key === 'ArrowRight') document.getElementById('next').click(); });
draw();
</script>
</body>
</html>
