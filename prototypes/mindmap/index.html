<!doctype html>
<!--
  PROTOTYPE — 버려도 되는 코드. 질문: "지금 캔버스(색 카드 · 다음 메모 연결 · 프로젝트 부채 · 정렬 · 독)에 무엇을 더하면 마인드맵으로도 쓸 수 있나?"
  기준 화면: Storybook Screens/Window States › Canvas, CanvasProjects. 새 화면을 만들지 않고 기존 캔버스에 한 가지씩 더한다.
  마인드맵의 가지 = 기존 "다음 메모 연결"(canvas.next). 새 데이터는 만들지 않는다.
  5개 시안을 ?variant=1..5 로 전환(하단 바 · ←/→ 키). 메모리 상태만, 저장 없음.
  결정된 안만 frontend/features/canvas 로 옮기고 이 폴더는 버린다.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE · 캔버스 마인드맵</title>
<style>
:root { color-scheme: light dark; }
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
:root {
  /* frontend/shared/tokens.css 값 */
  --bg: light-dark(#f4f4f6, #1a1b1e);
  --surface: light-dark(#fff, #26272b);
  --text: light-dark(#1d1d1f, #f2f2f4);
  --muted: light-dark(#636366, #a5a7ae);
  --hairline: light-dark(rgba(0,0,0,.09), rgba(255,255,255,.1));
  --accent: light-dark(#0a6cff, #1f6fe5);
  --done: light-dark(#34a46a, #4cc27f);
  --shadow: light-dark(rgba(27,34,48,.12), rgba(0,0,0,.35));
  --note-yellow: light-dark(#fff3c4, #3f3a28);
  --note-pink: light-dark(#fde2e9, #442f38);
  --note-blue: light-dark(#dcebfd, #2b3a4b);
  --note-green: light-dark(#e0f2dc, #2d3f32);
  --note-purple: light-dark(#ebe3fa, #393149);
  --link: color-mix(in srgb, var(--text) 45%, transparent);
  --disclosure: 300ms cubic-bezier(.333, 1, .667, 1);
  font-family: "Noto Sans KR", "Pretendard", system-ui, sans-serif; font-size: 13px;
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; padding: 18px 16px 110px; background: light-dark(#dcdde2, #0d0e10); color: var(--text); }
.head { max-width: 1100px; margin: 0 auto 12px; }
.head h1 { margin: 0 0 4px; font-size: 15px; }
.head p { margin: 0; color: var(--muted); line-height: 1.6; }
.head b { color: var(--text); font-weight: 600; }
/* 창 = 실제 캔버스 화면 구성(제목줄 · 경로 칩 · 점 격자 · 왼쪽 아래 독) */
.window { position: relative; max-width: 1100px; height: 660px; margin: 0 auto; overflow: hidden; border-radius: 12px; background: var(--bg); box-shadow: 0 0 0 1px var(--hairline), 0 12px 40px var(--shadow); }
.titlebar { height: 44px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 16px; font-weight: 600; }
.titlebar .wc { color: var(--muted); letter-spacing: 14px; font-weight: 400; }
.board { position: absolute; inset: 44px 0 0; background: radial-gradient(circle, color-mix(in srgb, var(--text) 13%, transparent) 1px, transparent 1px) 0 0 / 20px 20px; }
.crumb { position: absolute; left: 12px; top: 8px; z-index: 5; display: flex; gap: 2px; align-items: center; }
.crumb span { padding: 5px 10px; border-radius: 8px; background: color-mix(in srgb, var(--text) 7%, transparent); font-weight: 600; font-size: 12px; cursor: pointer; }
.crumb i { color: var(--muted); font-style: normal; padding: 0 2px; }
.dock { position: absolute; left: 14px; bottom: 14px; z-index: 6; display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 14px; border-radius: 12px; background: var(--surface); box-shadow: 0 0 0 1px var(--hairline), 0 4px 16px var(--shadow); color: var(--muted); font-size: 12px; }
.dock .sep { width: 1px; height: 18px; background: var(--hairline); }
.dock button, .pill { font: inherit; border: 0; padding: 4px 8px; border-radius: 7px; color: var(--text); background: transparent; cursor: pointer; }
.dock button:hover, .pill:hover { background: color-mix(in srgb, var(--text) 7%, transparent); }
.dock button.on { color: #fff; background: var(--accent); }
.new { position: relative; }
.new::after { content: "새"; position: absolute; top: -7px; right: -6px; padding: 0 4px; border-radius: 6px; color: #fff; background: var(--accent); font-size: 9px; line-height: 14px; }
/* 카드 = canvas-note 축소판 */
svg.links { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
svg.links path { fill: none; stroke: var(--link); stroke-width: 1.4; }
svg.links path.member { stroke-dasharray: 3 4; }
.card { position: absolute; width: 176px; height: 92px; display: flex; flex-direction: column; padding: 10px 12px; border-radius: 10px; background: var(--tone); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tone), var(--text) 14%), 0 1px 3px var(--shadow); cursor: pointer; user-select: none; transition: left var(--disclosure), top var(--disclosure), opacity 200ms ease-out, box-shadow 140ms ease-out, scale var(--disclosure); }
.card.sel { box-shadow: 0 0 0 2px var(--accent), 0 6px 18px var(--shadow); z-index: 3; }
.card.dim { opacity: .22; }
.card.mini { width: 150px; height: 56px; padding: 8px 10px; scale: 1; }
.card.mini .body, .card.mini .foot { display: none; }
.card .title { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.card .title input { min-width: 0; flex: 1; font: inherit; border: 0; outline: 0; background: transparent; color: inherit; }
.card .body { margin-top: 5px; color: var(--muted); font-size: 11px; line-height: 1.45; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.card .foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 10px; }
.card .check { margin-left: auto; display: grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; color: #fff; background: var(--done); font-size: 10px; }
.card.project::before, .card.project::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 10px; background: color-mix(in srgb, var(--tone) 90%, black); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tone), var(--text) 14%); transform: translate(4px, 4px); transition: transform var(--disclosure), opacity var(--disclosure); }
.card.project::after { transform: translate(8px, 8px); opacity: .7; }
.card.project.open::before, .card.project.open::after { transform: none; opacity: 0; }
.add { position: absolute; z-index: 4; width: 22px; height: 22px; display: grid; place-items: center; border: 0; border-radius: 50%; color: #fff; background: var(--accent); box-shadow: 0 2px 6px var(--shadow); cursor: pointer; font-size: 15px; line-height: 1; }
.pop { position: absolute; z-index: 7; left: 160px; bottom: 62px; width: 230px; padding: 6px; border-radius: 12px; background: var(--surface); box-shadow: 0 0 0 1px var(--hairline), 0 14px 36px var(--shadow); }
.pop .item { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.pop .item:hover { background: color-mix(in srgb, var(--text) 6%, transparent); }
.pop kbd { color: var(--muted); font: 11px ui-monospace, monospace; }
.panel { position: absolute; right: 0; top: 0; bottom: 0; z-index: 6; width: 280px; padding: 14px 10px; border-left: 1px solid var(--hairline); background: var(--surface); overflow: auto; }
.panel h3 { margin: 0 6px 8px; font-size: 12px; color: var(--muted); font-weight: 600; }
.row { display: flex; align-items: center; gap: 6px; height: 28px; padding-right: 8px; border-radius: 7px; cursor: pointer; white-space: nowrap; }
.row:hover { background: color-mix(in srgb, var(--text) 5%, transparent); }
.row.sel { background: color-mix(in srgb, var(--accent) 16%, transparent); }
.row .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--tone); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tone), var(--text) 30%); }
.row.done span:last-child { color: var(--muted); text-decoration: line-through; }
.hint { position: absolute; right: 14px; bottom: 14px; z-index: 6; max-width: 300px; padding: 8px 12px; border-radius: 10px; background: color-mix(in srgb, var(--surface) 92%, transparent); box-shadow: inset 0 0 0 1px var(--hairline); color: var(--muted); font-size: 11px; line-height: 1.6; }
.hint b { color: var(--text); }
.bar { position: fixed; left: 50%; bottom: 16px; translate: -50% 0; z-index: 20; display: flex; align-items: center; gap: 4px; padding: 6px; border-radius: 12px; background: var(--surface); box-shadow: 0 0 0 1px var(--hairline), 0 10px 30px var(--shadow); }
.bar button { font: inherit; border: 0; padding: 5px 10px; border-radius: 8px; color: var(--text); background: transparent; cursor: pointer; }
.bar button.on { color: #fff; background: var(--accent); }
.bar .lab { padding: 0 8px; color: var(--muted); font-size: 11px; }
@media (prefers-reduced-motion: reduce) { .card, .card.project::before, .card.project::after { transition: none; } }
</style>
</head>
<body>
<div class="head"><h1 id="title"></h1><p id="why"></p></div>
<div class="window"><div class="titlebar"><span class="wc">✕ – ☐</span><span>메모 캔버스</span><span></span></div><div class="board" id="board"></div></div>
<div class="bar" id="bar"></div>
<script>
// ── 공유 상태: 실제 Note.canvas 모양(position · next · done · parent · project)을 줄여 쓴다 ──
const W = 176, H = 92;
let seq = 20;
const C = (id, title, body, tone, x, y, extra = {}) => ({ id, title, body, tone, x, y, next: [], done: false, parent: null, project: false, ...extra });
const cards = [
  C('c1', '출시 계획', '이번 달 안에 첫 공개 버전을 낸다.', 'yellow', 60, 230),
  C('c2', '디자인', '아이콘과 첫 화면 흐름 정리', 'pink', 330, 70),
  C('c3', '개발', '남은 버그와 성능', 'blue', 380, 300, { project: true }),
  C('c4', '홍보', '알릴 곳 정하기', 'green', 290, 470),
  C('c5', '아이콘 시안', '세 가지 방향 비교', 'pink', 640, 30, { done: true }),
  C('c6', '온보딩 흐름', '첫 메모까지 세 단계', 'pink', 600, 150),
  C('c7', '데모 영상', '30초 캔버스 시연', 'green', 600, 470),
  C('c8', '오늘의 작은 기록', '여유롭게, 내 속도로.', 'purple', 830, 330),
  // 프로젝트 "개발" 안의 메모(평소엔 들어가야 보임)
  C('k1', '캔버스 성능', '카드 100장에서 끊김', 'blue', 0, 0, { parent: 'c3' }),
  C('k2', '동기화 버그', '저장 표시가 늦게 바뀜', 'blue', 0, 0, { parent: 'c3', done: true }),
  C('k3', '단축키 정리', 'Tab · Enter 동작 확정', 'blue', 0, 0, { parent: 'c3' }),
];
const link = (a, ...b) => byId(a).next.push(...b);
const byId = (id) => cards.find((c) => c.id === id);
link('c1', 'c2', 'c3', 'c4'); link('c2', 'c5', 'c6'); link('c4', 'c7');
const home = Object.fromEntries(cards.map((c) => [c.id, { x: c.x, y: c.y }]));
let selected = 'c1';
const ui = { mapped: false, menu: false, editing: null, open: false, branchOnly: true };

const topCards = () => cards.filter((c) => !c.parent);
const linkCount = () => topCards().reduce((s, c) => s + c.next.length, 0);
const parentsOf = (id) => topCards().filter((c) => c.next.includes(id));
const branch = (id) => { // 선택한 카드의 조상 + 자손(연결 기준)
  const set = new Set([id]);
  const up = (x) => parentsOf(x).forEach((p) => { if (!set.has(p.id)) { set.add(p.id); up(p.id); } });
  const down = (x) => byId(x).next.forEach((n) => { if (!set.has(n)) { set.add(n); down(n); } });
  up(id); down(id); return set;
};
const rootOf = (id) => { let cur = id, seen = new Set(); while (parentsOf(cur).length && !seen.has(cur)) { seen.add(cur); cur = parentsOf(cur)[0].id; } return cur; };
// 오른쪽으로 자라는 마인드맵 배치: 깊이 = 열, 잎 수 비례 = 행. 연결 순서를 그대로 쓴다.
function mindLayout(rootId, x0 = 40, y0 = 30, colW = 240, rowH = 112) {
  const pos = {}; let cursor = y0; const seen = new Set();
  (function walk(id, depth) {
    seen.add(id); const kids = byId(id).next.filter((n) => !seen.has(n));
    if (!kids.length) { pos[id] = { x: x0 + depth * colW, y: cursor }; cursor += rowH; return; }
    kids.forEach((k) => walk(k, depth + 1));
    pos[id] = { x: x0 + depth * colW, y: (pos[kids[0]].y + pos[kids.at(-1)].y) / 2 };
  })(rootId, 0);
  return pos;
}

// ── 그리기 공통 ──
const esc = (s) => s.replace(/[&<>"]/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[m]);
function cardEl(c, opts = {}) {
  const el = document.createElement('div');
  el.className = `card${c.id === selected ? ' sel' : ''}${c.project ? ' project' : ''}${c.project && ui.open ? ' open' : ''}${opts.mini ? ' mini' : ''}${opts.dim ? ' dim' : ''}`;
  el.style.setProperty('--tone', `var(--note-${c.tone})`);
  el.style.left = c.x + 'px'; el.style.top = c.y + 'px';
  const title = ui.editing === c.id ? `<input value="${esc(c.title)}" aria-label="새 메모 제목">` : esc(c.title);
  const kids = cards.filter((k) => k.parent === c.id);
  el.innerHTML = `<div class="title">${c.project ? '▭ ' : ''}${title}${c.done ? '<span class="check">✓</span>' : ''}</div><div class="body">${esc(c.body)}</div>
    <div class="foot"><span>${c.project ? `메모 ${kids.length}개` : c.next.length ? `⤳ ${c.next.length}` : ''}</span><span>${c.project ? `완료 ${kids.filter((k) => k.done).length}/${kids.length}` : ''}</span></div>`;
  el.onclick = (e) => { e.stopPropagation(); if (opts.onClick) opts.onClick(c); else { selected = c.id; render(); } };
  const input = el.querySelector('input');
  if (input) {
    setTimeout(() => { input.focus(); input.select(); });
    input.onkeydown = (e) => { e.stopPropagation(); if (e.key === 'Enter' || e.key === 'Escape' || e.key === 'Tab') { c.title = input.value || '새 메모'; ui.editing = null; if (e.key === 'Tab') { e.preventDefault(); addChild(); } else if (e.key === 'Enter' && e.isComposing === false) { addSibling(); } else render(); } };
    input.onblur = () => { if (ui.editing === c.id) { c.title = input.value || '새 메모'; ui.editing = null; render(); } };
  }
  return el;
}
// 연결선: 실제 캔버스처럼 오른쪽 가장자리 → 왼쪽 가장자리 곡선 + 끝 화살표
function drawLinks(svg, pairs) {
  svg.innerHTML = '<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="var(--surface)" stroke="var(--link)" stroke-width="1.2"/></marker></defs>';
  pairs.forEach(({ a, b, cls, aw = W, ah = H, bw = W, bh = H }) => {
    const ax = a.x + aw, ay = a.y + ah / 2, bx = b.x, by = b.y + bh / 2;
    const backwards = bx < ax - 20; const k = Math.max(40, Math.abs(bx - ax) / 2);
    const d = backwards ? `M${a.x + aw / 2},${a.y + ah} C${a.x + aw / 2},${a.y + ah + 60} ${b.x + bw / 2},${b.y - 60} ${b.x + bw / 2},${b.y}` : `M${ax},${ay} C${ax + k},${ay} ${bx - k},${by} ${bx},${by}`;
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p.setAttribute('d', d);
    if (cls) p.classList.add(cls); else p.setAttribute('marker-end', 'url(#arr)');
    svg.appendChild(p);
  });
}
function chrome(board, { crumbs = ['전체'], dockExtra = '' } = {}) {
  board.insertAdjacentHTML('beforeend', `<div class="crumb">${crumbs.map((c, i) => `${i ? '<i>›</i>' : ''}<span data-i="${i}">${i ? '' : '⌂ '}${esc(c)}</span>`).join('')}</div>
    <div class="dock"><span>↶ ↷</span><span class="sep"></span><span>− 100% + ⛶</span><span class="sep"></span>${dockExtra}<span>메모 ${topCards().length} · 연결 ${linkCount()}</span><span>저장됨</span></div>`);
}
const hint = (board, html) => board.insertAdjacentHTML('beforeend', `<div class="hint">${html}</div>`);
function standardBoard(board, { dimSet = null, mapped = null } = {}) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); svg.classList.add('links'); board.appendChild(svg);
  topCards().forEach((c) => { if (mapped?.[c.id]) Object.assign(c, mapped[c.id]); board.appendChild(cardEl(c, { dim: dimSet && !dimSet.has(c.id) })); });
  const pairs = topCards().flatMap((a) => a.next.map((id) => ({ a, b: byId(id) })));
  drawLinks(svg, pairs);
  return svg;
}

// 새 가지 만들기(시안 2·4 공용): 연결로 잇고, 형제들 아래에 놓는다.
function addChild(parentId = selected) {
  const p = byId(parentId); if (!p || p.parent) return;
  const below = p.next.map(byId); const y = below.length ? Math.max(...below.map((b) => b.y)) + 112 : p.y;
  const c = C('n' + seq++, '새 메모', '', p.tone, p.x + 240, y); cards.push(c); home[c.id] = { x: c.x, y: c.y };
  p.next.push(c.id); selected = c.id; ui.editing = c.id; render();
}
function addSibling() { const par = parentsOf(selected)[0]; if (par) addChild(par.id); else render(); }
function outdent() { // Shift+Tab: 할아버지 가지로 올린다
  const par = parentsOf(selected)[0]; const gp = par && parentsOf(par.id)[0]; if (!gp) return;
  par.next = par.next.filter((n) => n !== selected); gp.next.splice(gp.next.indexOf(par.id) + 1, 0, selected); render();
}
function indent() { // Tab(개요): 바로 위 형제의 하위로
  const par = parentsOf(selected)[0]; if (!par) return; const i = par.next.indexOf(selected); if (i < 1) return;
  const prev = byId(par.next[i - 1]); par.next.splice(i, 1); prev.next.push(selected); render();
}

// ── 시안 ──
const variants = [
  {
    name: '정렬 메뉴에 "마인드맵으로 배치"',
    why: '<b>무엇을 더하나:</b> 이미 있는 정렬(격자로 정리 · 연결 순서로 배치) 옆에 한 줄만. 선택한 카드에서 시작해 <b>연결된 메모를 오른쪽으로 가지치듯</b> 다시 놓는다. 위치만 바뀌고 실행 취소로 돌아간다. <b>왜 자연스럽나:</b> 사용자는 이미 연결을 만들고 있다. 흩어진 연결을 "맵 모양"으로 읽게 해 주는 게 가장 작은 첫걸음이다. <b>위험:</b> 손으로 놓은 위치를 덮는다 → 실행 취소 필수.',
    render(board) {
      const mapped = ui.mapped ? mindLayout(rootOf(selected), 40, 50) : null;
      if (!ui.mapped) topCards().forEach((c) => Object.assign(c, home[c.id]));
      standardBoard(board, { mapped });
      chrome(board, { dockExtra: `<button id="align" class="${ui.menu ? 'on' : ''}">⊞ 정렬</button><span class="sep"></span>` });
      if (ui.menu) {
        board.insertAdjacentHTML('beforeend', `<div class="pop"><div class="item">격자로 정리 <kbd>T</kbd></div><div class="item">연결 순서로 배치 <kbd>F</kbd></div><div class="item new" id="mm">마인드맵으로 배치 <kbd>M</kbd></div>${ui.mapped ? '<div class="item" id="undo">원래 자리로 <kbd>⌘Z</kbd></div>' : ''}</div>`);
        board.querySelector('#mm').onclick = (e) => { e.stopPropagation(); ui.mapped = true; ui.menu = false; render(); };
        board.querySelector('#undo')?.addEventListener('click', (e) => { e.stopPropagation(); ui.mapped = false; ui.menu = false; render(); });
      }
      board.querySelector('#align').onclick = (e) => { e.stopPropagation(); ui.menu = !ui.menu; render(); };
      hint(board, '독의 <b>⊞ 정렬 → 마인드맵으로 배치</b>.<br>시작점은 선택한 카드가 속한 가지의 뿌리. 연결 없는 카드는 그대로 둔다.');
    },
  },
  {
    name: 'Tab · Enter로 가지 치기',
    why: '<b>무엇을 더하나:</b> 선택한 카드 오른쪽·아래에 <b>+ 손잡이</b>. <kbd>Tab</kbd> = 연결된 다음 메모(하위 가지), <kbd>Enter</kbd> = 같은 부모의 형제. 새 카드는 바로 제목 입력 상태로 놓인다. <b>왜 자연스럽나:</b> 지금도 "끌어서 다음 메모에 연결" 손잡이가 있다. 끌기 대신 한 번에 만들고 잇는 지름길이다. 마인드맵 도구의 핵심 리듬(생각 → Tab → 생각)을 그대로 준다. <b>위험:</b> 캔버스의 기존 Tab(포커스 이동)과 충돌 → 카드 선택 중에만 동작.',
    render(board) {
      standardBoard(board);
      chrome(board);
      const s = byId(selected);
      if (s && !s.parent && !ui.editing) {
        board.insertAdjacentHTML('beforeend', `<button class="add" id="ac" title="하위 가지 (Tab)" style="left:${s.x + W + 8}px;top:${s.y + H / 2 - 11}px">+</button>` + (parentsOf(s.id).length ? `<button class="add" id="as" title="형제 (Enter)" style="left:${s.x + W / 2 - 11}px;top:${s.y + H + 8}px">+</button>` : ''));
        board.querySelector('#ac').onclick = (e) => { e.stopPropagation(); addChild(); };
        board.querySelector('#as')?.addEventListener('click', (e) => { e.stopPropagation(); addSibling(); });
      }
      hint(board, '카드를 고르고 <b>Tab</b> = 하위, <b>Enter</b> = 형제.<br>입력 중 Tab을 한 번 더 누르면 바로 다음 가지로.');
    },
    keys: { Tab: () => addChild(), Enter: () => addSibling() },
  },
  {
    name: '프로젝트를 제자리에서 가지로 펼치기',
    why: '<b>무엇을 더하나:</b> 프로젝트 카드의 ⌄(이미 있는 펼침 버튼)를 누르면, 들어가지 않고 <b>하위 메모가 카드 둘레에 작은 가지로</b> 펼쳐진다. 뒤에 쌓인 종이가 풀리며 나오는 모션은 목록형과 같은 300ms. <b>왜 자연스럽나:</b> 프로젝트 = 이미 계층. 들어가기(깊이)와 펼치기(넓이)를 둘 다 주면 맵 안에서 계층을 한눈에 본다. <b>위험:</b> 펼친 가지가 다른 카드를 가린다 → 펼친 동안 주변 카드를 흐리게.',
    render(board) {
      topCards().forEach((c) => Object.assign(c, home[c.id]));
      const proj = byId('c3'); const kids = cards.filter((k) => k.parent === proj.id);
      const around = new Set(ui.open ? ['c3', 'c1'] : topCards().map((c) => c.id));
      const svg = standardBoard(board, { dimSet: ui.open ? around : null });
      const kidPairs = [];
      kids.forEach((k, i) => {
        const tx = proj.x + W + 70, ty = proj.y - 50 + i * 72;
        Object.assign(k, ui.open ? { x: tx, y: ty } : { x: proj.x + 8, y: proj.y + 8 });
        const el = cardEl(k, { mini: true }); el.style.opacity = ui.open ? 1 : 0; el.style.zIndex = 2; el.style.transitionDelay = ui.open ? `${i * 35}ms` : '0ms';
        board.appendChild(el); if (ui.open) kidPairs.push({ a: proj, b: k, cls: 'member', bw: 150, bh: 56 });
      });
      const pairs = topCards().flatMap((a) => a.next.map((id) => ({ a, b: byId(id) })));
      drawLinks(svg, [...pairs, ...kidPairs]);
      board.insertAdjacentHTML('beforeend', `<button class="add" id="tog" title="${ui.open ? '접기' : '가지로 펼치기'}" style="left:${proj.x + W / 2 - 11}px;top:${proj.y + H - 26}px;background:var(--surface);color:var(--text);transition:rotate var(--disclosure);rotate:${ui.open ? 180 : 0}deg">⌄</button>`);
      board.querySelector('#tog').onclick = (e) => { e.stopPropagation(); ui.open = !ui.open; render(); };
      chrome(board);
      hint(board, '프로젝트 <b>개발</b>의 ⌄를 누른다.<br>점선 = 프로젝트 소속, 실선 화살표 = 다음 메모 연결. 들어가기(↗)는 그대로.');
    },
  },
  {
    name: '인스펙터에 "가지 개요" 탭',
    why: '<b>무엇을 더하나:</b> 오른쪽 인스펙터(이미 있는 "연결: 이전 → 이 메모 → 다음" 칸)를 넓혀, 선택한 가지 전체를 <b>들여쓰기 개요</b>로 보여 준다. 개요에서 <kbd>Tab</kbd>/<kbd>Shift+Tab</kbd>로 가지를 옮기면 캔버스 연결선이 바로 바뀐다. <b>왜 자연스럽나:</b> 목록형 사용자는 개요로 생각한다. 키보드·스크린리더로도 맵을 다룰 수 있다. <b>위험:</b> 연결은 그래프(여러 부모 가능)라 개요는 첫 부모 기준으로만 보인다.',
    render(board) {
      topCards().forEach((c) => Object.assign(c, home[c.id]));
      standardBoard(board);
      chrome(board);
      const root = rootOf(selected); const panel = document.createElement('div'); panel.className = 'panel';
      panel.innerHTML = `<h3>가지 개요 · ${esc(byId(root).title)}</h3>`; panel.setAttribute('role', 'tree');
      const seen = new Set();
      (function rows(id, depth) {
        if (seen.has(id)) return; seen.add(id); const c = byId(id);
        const r = document.createElement('div'); r.className = `row${id === selected ? ' sel' : ''}${c.done ? ' done' : ''}`; r.setAttribute('role', 'treeitem');
        r.style.paddingLeft = 8 + depth * 18 + 'px'; r.style.setProperty('--tone', `var(--note-${c.tone})`);
        r.innerHTML = `<span class="dot"></span><span>${esc(c.title)}</span>`; r.onclick = () => { selected = id; render(); };
        panel.appendChild(r); c.next.forEach((n) => rows(n, depth + 1));
      })(root, 0);
      panel.insertAdjacentHTML('beforeend', '<p style="margin:12px 8px;color:var(--muted);font-size:11px;line-height:1.6"><b style="color:var(--text)">Tab</b> 위 형제 아래로 · <b style="color:var(--text)">Shift+Tab</b> 한 단계 위로<br>바꾸면 캔버스 연결선이 따라 바뀐다. 카드 위치는 그대로.</p>');
      board.appendChild(panel);
    },
    keys: { Tab: (e) => (e.shiftKey ? outdent() : indent()) },
  },
  {
    name: '가지만 보기(초점)',
    why: '<b>무엇을 더하나:</b> 카드를 고르면 그 카드의 <b>조상과 자손 가지만 또렷하게</b>, 나머지는 흐리게. 경로 칩이 "전체 › 출시 계획 › 디자인"처럼 가지 경로를 보여 준다. 독에 켜고 끄는 버튼 하나. <b>왜 자연스럽나:</b> 카드가 많아질수록 맵은 읽기 어렵다. 위치를 바꾸지 않고 읽기만 돕는다(시안 1과 함께 쓰기 좋다). 기존 경로 칩("⌂ 전체")을 재사용한다. <b>위험:</b> 흐린 카드를 놓치기 쉽다 → 흐린 카드를 누르면 그 가지로 초점 이동.',
    render(board) {
      topCards().forEach((c) => Object.assign(c, home[c.id]));
      const set = ui.branchOnly ? branch(selected) : null;
      standardBoard(board, { dimSet: set });
      const path = []; let cur = selected; const seen = new Set();
      while (cur && !seen.has(cur)) { seen.add(cur); path.unshift(byId(cur).title); cur = parentsOf(cur)[0]?.id; }
      chrome(board, { crumbs: ui.branchOnly ? ['전체', ...path] : ['전체'], dockExtra: `<button id="bo" class="${ui.branchOnly ? 'on' : ''}">가지만 보기</button><span class="sep"></span>` });
      board.querySelector('#bo').onclick = (e) => { e.stopPropagation(); ui.branchOnly = !ui.branchOnly; render(); };
      board.querySelectorAll('.crumb span').forEach((s) => { s.onclick = (e) => { e.stopPropagation(); if (s.dataset.i === '0') { ui.branchOnly = false; render(); } }; });
      hint(board, '다른 카드를 눌러 초점을 옮긴다.<br><b>⌂ 전체</b>를 누르면 모두 다시 보인다.');
    },
  },
];

// ── 전환 ──
let v = Math.min(Math.max(+new URLSearchParams(location.search).get('variant') || 1, 1), variants.length);
function render() {
  const board = document.getElementById('board'); board.innerHTML = '';
  board.onclick = () => { if (ui.menu) { ui.menu = false; render(); } };
  const cur = variants[v - 1];
  document.getElementById('title').textContent = `시안 ${v}. ${cur.name}`;
  document.getElementById('why').innerHTML = cur.why;
  cur.render(board);
  const bar = document.getElementById('bar');
  bar.innerHTML = `<span class="lab">캔버스 마인드맵</span>${variants.map((x, i) => `<button class="${i + 1 === v ? 'on' : ''}" data-v="${i + 1}" title="${x.name}">${i + 1}</button>`).join('')}<span class="lab">선택: ${esc(byId(selected)?.title ?? '-')}</span><button id="theme">테마</button>`;
  bar.querySelectorAll('[data-v]').forEach((b) => { b.onclick = () => go(+b.dataset.v); });
  bar.querySelector('#theme').onclick = () => { const r = document.documentElement; r.dataset.theme = r.dataset.theme === 'dark' ? 'light' : 'dark'; };
}
function go(n) { v = n; ui.menu = false; ui.editing = null; try { history.replaceState(null, '', '?variant=' + v); } catch { /* data: 미리보기 */ } render(); }
addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  const k = variants[v - 1].keys?.[e.key];
  if (k) { e.preventDefault(); k(e); return; }
  if (e.key === 'ArrowRight') go(v % variants.length + 1);
  else if (e.key === 'ArrowLeft') go((v + variants.length - 2) % variants.length + 1);
  else if (v === 1 && e.key.toLowerCase() === 'm') { ui.mapped = true; render(); }
});
render();
</script>
</body>
</html>
