function art(n,happy){
  const {g,f}=SPR[n],H=g.length+2,W=Math.max(...g.map(r=>r.length))+2;
  const m=(x,y)=>{const r=g[y-1];return r&&x>0?(r[x-1]||'.'):'.'}, filled=(x,y)=>MAT[m(x,y)];
  const C=Array.from({length:H},()=>Array(W).fill(null));
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const k=m(x,y);
    if(MAT[k]){const M=MAT[k];C[y][x]=!filled(x,y-1)?M[2]:(!filled(x,y+1)||!filled(x+1,y))?M[1]:M[0];}
    else{const nb=[[0,-1],[0,1],[-1,0],[1,0]].map(([dx,dy])=>m(x+dx,y+dy)).find(c=>MAT[c]);if(nb)C[y][x]=MAT[nb][3];}}
  const put=(x,y,c)=>{if(C[y+1]&&x+1<W)C[y+1][x+1]=c};
  for(const [ex,ey,gap] of f){const eyes=gap?[ex,ex+gap]:[ex];
    for(const x of eyes){if(happy){put(x-1,ey+1,EYE);put(x,ey,EYE);put(x+1,ey+1,EYE);}else{put(x,ey,EYE);put(x,ey+1,EYE);}}
    if(gap){put(ex-1,ey+2,BLUSH);put(ex+gap+1,ey+2,BLUSH);const mx=ex+Math.floor(gap/2);
      if(happy){put(mx,ey+2,EYE);put(mx+(gap%2?1:0),ey+2,EYE);put(mx,ey+3,'#c8463f');if(gap%2)put(mx+1,ey+3,'#c8463f');}
      else{put(mx,ey+2,EYE);if(gap%2)put(mx+1,ey+2,EYE);}}
    else{put(ex,ey+2,BLUSH);if(happy)put(ex-1,ey+2,EYE);}}
  return C;
}
