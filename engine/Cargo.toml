[package]
name = "memoivy-engine"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "memoivy-engine"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
fs2 = "0.4"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
