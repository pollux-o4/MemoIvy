name: Release
# 커밋(Conventional Commits)에서 릴리스 PR을 유지하고, 병합되면 태그·GitHub Release를 만든 뒤 후보 빌드를 호출한다(OPS-005).
# GITHUB_TOKEN이 만든 Release는 다른 워크플로를 깨우지 않으므로 후보 빌드는 재사용 워크플로로 직접 호출한다.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  candidates:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    uses: ./.github/workflows/release-candidates.yml
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      tag: ${{ needs.release-please.outputs.tag }}
    secrets: inherit
