name: Microsoft Store submission
# 공개된 GitHub Release의 MSIX를 체크섬 확인 뒤 Store 제품에 새 제출로 올린다.
# Store 인증·공개는 Partner Center가 이어서 처리한다(OPS-005).

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    secrets:
      MSSTORE_TENANT_ID:
        required: true
      MSSTORE_CLIENT_ID:
        required: true
      MSSTORE_CLIENT_SECRET:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 공개된 GitHub Release 태그
        type: string
        required: true

permissions:
  contents: read

jobs:
  submit:
    # 출시 호출은 main에서, 수동 재제출은 고친 워크플로를 쓰도록 어느 브랜치에서든 연다. 태그는 아래에서 최신 공개 출시로 제한한다.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    concurrency:
      group: msstore-submission
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - id: msix
        uses: ./.github/actions/release-asset
        with:
          tag: ${{ inputs.tag }}
          package: MemoIvy-{version}-x64.msix
          checksums: SHA256SUMS-windows
      - name: Check Store configuration
        env:
          TENANT: ${{ secrets.MSSTORE_TENANT_ID }}
          CLIENT: ${{ secrets.MSSTORE_CLIENT_ID }}
          SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          SELLER: ${{ vars.MSSTORE_SELLER_ID }}
          PRODUCT: ${{ vars.MSSTORE_PRODUCT_ID }}
        run: |
          missing=()
          for name in TENANT CLIENT SECRET SELLER PRODUCT; do [[ -n "${!name}" ]] || missing+=("$name"); done
          if (( ${#missing[@]} )); then
            echo "::error::Missing Store settings: ${missing[*]} (secrets MSSTORE_TENANT_ID/CLIENT_ID/CLIENT_SECRET, variables MSSTORE_SELLER_ID/PRODUCT_ID)."
            exit 1
          fi
      - uses: microsoft/setup-msstore-cli@v1
      - name: Submit to Microsoft Store
        shell: pwsh
        env:
          TENANT: ${{ secrets.MSSTORE_TENANT_ID }}
          CLIENT: ${{ secrets.MSSTORE_CLIENT_ID }}
          SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          SELLER: ${{ vars.MSSTORE_SELLER_ID }}
          PRODUCT: ${{ vars.MSSTORE_PRODUCT_ID }}
          MSIX_PACKAGE: ${{ steps.msix.outputs.path }}
        run: |
          msstore reconfigure --tenantId $env:TENANT --sellerId $env:SELLER --clientId $env:CLIENT --clientSecret $env:SECRET
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # 만든 MSIX는 경로 인자로 직접 넘긴다(Microsoft의 GitHub Actions 예시). 폴더를 넘기면 프로젝트 종류를 찾다 실패한다.
          # 제출은 커밋돼 Store 인증으로 넘어간다.
          msstore publish $env:MSIX_PACKAGE --appId $env:PRODUCT
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
