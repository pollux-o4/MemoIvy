name: Release
# dev→main squash 병합이 곧 출시다: package.json 버전(SSoT)으로 초안 Release를 만들고,
# 병합 PR의 CI 통과를 확인하고(ci-gate) 후보 빌드가 산출물을 붙인 뒤에만 공개해 태그를 남긴다. Release 본문은 squash 커밋 본문이다(OPS-005).
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: plan
        run: node scripts/release-plan.mjs
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          git log -1 --format=%b > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "MemoIvy $VERSION" --notes-file "$RUNNER_TEMP/notes.md"

  # 병합 PR에서 같은 코드가 CI를 통과했으면 다시 돌리지 않는다. 확인할 수 없을 때만 CI 전체를 다시 실행한다.
  ci-gate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      passed: ${{ steps.gate.outputs.passed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-ci-gate.mjs

  ci:
    needs: ci-gate
    if: needs.ci-gate.outputs.passed != 'true'
    uses: ./.github/workflows/ci.yml

  candidates:
    needs: [draft, ci-gate, ci]
    if: ${{ !cancelled() && needs.draft.result == 'success' && needs.ci-gate.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.ci.result) }}
    uses: ./.github/workflows/release-candidates.yml
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      tag: ${{ needs.draft.outputs.tag }}
    secrets: inherit

  publish:
    needs: [draft, candidates]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  snap-candidate:
    needs: [draft, publish]
    if: vars.SNAP_STORE_CANDIDATE_ENABLED == 'true'
    uses: ./.github/workflows/snap-store-candidate.yml
    with:
      tag: ${{ needs.draft.outputs.tag }}
    secrets:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}

  msstore-submission:
    needs: [draft, publish]
    if: vars.MSSTORE_PRODUCT_ID != ''
    uses: ./.github/workflows/msstore-submission.yml
    with:
      tag: ${{ needs.draft.outputs.tag }}
    secrets:
      MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
      MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
      MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
