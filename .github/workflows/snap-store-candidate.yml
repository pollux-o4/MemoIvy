name: Snap Store candidate
# 공개된 GitHub Release의 Snap을 체크섬 확인 뒤 latest/candidate에 올린다(OPS-005).

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    secrets:
      SNAPCRAFT_STORE_CREDENTIALS:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 공개된 GitHub Release 태그
        type: string
        required: true

permissions:
  contents: read

jobs:
  upload:
    # 출시 호출은 main에서, 수동 재업로드는 고친 워크플로를 쓰도록 어느 브랜치에서든 연다. 태그는 최신 공개 출시로 제한한다.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: snap-store-candidate
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - id: snap
        uses: ./.github/actions/release-asset
        with:
          tag: ${{ inputs.tag }}
          package: memoivy_{version}_amd64.snap
          checksums: SHA256SUMS-snap
      - run: sudo snap install snapcraft --classic
      - name: Upload to latest/candidate
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          SNAP_PACKAGE: ${{ steps.snap.outputs.path }}
        run: |
          if [[ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]]; then
            echo '::error::Set the SNAPCRAFT_STORE_CREDENTIALS Actions secret.'
            exit 1
          fi
          snapcraft upload --release=latest/candidate "$SNAP_PACKAGE"
