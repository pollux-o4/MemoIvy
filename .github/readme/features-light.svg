<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="236" viewBox="0 0 1200 236"><g transform="translate(0.0,0)"><rect x=".5" y=".5" width="383.0" height="235" rx="14" fill="#ffffff" stroke="#dcdcd8"/><g transform="translate(28,28)"><path d="M0 4a4 4 0 0 1 4-4h32a4 4 0 0 1 4 4v24l-12 12H4a4 4 0 0 1-4-4z" fill="#fff4c2" stroke="#e0b83a" stroke-width="1.6"/><path d="M28 40V30a2 2 0 0 1 2-2h10" fill="none" stroke="#e0b83a" stroke-width="1.6"/><path d="M8 11h18M8 18h22M8 25h12" stroke="#1f2328" stroke-width="2" stroke-linecap="round" opacity=".7"/></g><text x="360.0" y="44" text-anchor="end" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#6e6e6e" letter-spacing="1.4">01</text><text x="28" y="134" font-family="-apple-system,'Pretendard','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif" font-size="27" font-weight="700" fill="#1f2328">메모마다 독립 창</text><text x="28" y="172" font-family="-apple-system,'Pretendard','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif" font-size="19" fill="#6e6e6e">필요한 메모만 띄워 옆에 붙여 둡니다.</text><text x="28" y="200" font-family="-apple-system,'Pretendard','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif" font-size="19" fill="#6e6e6e">쓰는 즉시 자동으로 저장됩니다.</text><rect x="28" y="214" width="28" height="3" rx="1.5" fill="#ff6b35"/></g><g transform="translate(408.0,0)"><rect x=".5" y=".5" width="383.0" height="235" rx="14" fill="#ffffff" stroke="#dcdcd8"/><g transform="translate(28,28)" fill="none" stroke="#1f2328" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 2 20l10 16M32 4l10 16-10 16"/><path d="M26 6 18 34" stroke="#ff6b35"/></g><text x="360.0" y="44" text-anchor="end" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#6e6e6e" letter-spacing="1.4">02</text><text x="28" y="134" font-family="-apple-system,'Pretendard','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif" font-size="27" font-weight="700" fill="#1f2328">무료 · 오픈소스</text><text x="28" y="172" font-family="-apple-system,'Pretendard','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif" font-size="19" fill="#6e6e6e">광고·구독 없이 모든 기능을 씁니다.</text><text x="28" y="200" font-family="-apple-system,'Pretendard','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif" font-size="19" fill="#6e6e6e">코드는 MIT 라이선스로 공개합니다.</text><rect x="28" y="214" width="28" height="3" rx="1.5" fill="#ff6b35"/></g><g transform="translate(816.0,0)"><rect x=".5" y=".5" width="383.0" height="235" rx="14" fill="#ffffff" stroke="#dcdcd8"/><g transform="translate(30,26)" fill="none" stroke="#1f2328" stroke-width="1.8" stroke-linejoin="round"><rect x="0" y="10" width="36" height="22" rx="4"/><path d="M4 32v6h28v-6" opacity=".5"/><path d="M8 10V7a10 7 0 0 1 20 0v3" stroke="#ff6b35" stroke-linecap="round"/><circle cx="18" cy="21" r="3" fill="#ff6b35" stroke="none"/></g><text x="360.0" y="44" text-anchor="end" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#6e6e6e" letter-spacing="1.4">03</text><text x="28" y="134" font-family="-apple-system,'Pretendard','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif" font-size="27" font-weight="700" fill="#1f2328">계정 없이, 내 컴퓨터에</text><text x="28" y="172" font-family="-apple-system,'Pretendard','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif" font-size="19" fill="#6e6e6e">가입·서버 없이 로컬에 저장하고,</text><text x="28" y="200" font-family="-apple-system,'Pretendard','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif" font-size="19" fill="#6e6e6e">인터넷 없이도 그대로 씁니다.</text><rect x="28" y="214" width="28" height="3" rx="1.5" fill="#ff6b35"/></g></svg>