[package]
name = "memoivy"
version = "0.1.2"
edition = "2021"

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_10"] }
pulldown-cmark = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
