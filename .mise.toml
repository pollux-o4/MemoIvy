[tools]
node = "24.21.0"
rust = "1.99.1"
"aqua:gitleaks/gitleaks" = "8.30.1"

[bootstrap.packages]
"apt:build-essential" = "latest"
"apt:pkg-config" = "latest"
"apt:zenity" = "latest"
"apt:xvfb" = "latest"

[tasks.dev]
description = "개발 모드로 실행"
run = "npm run dev"

[tasks."dev:sample"]
description = "표본 데이터(.dev-data)로 개발 모드 실행: 카드·연결·프로젝트 경우의 수 (실데이터와 분리)"
run = "node tools/dev-data/seed.cjs && MEMOIVY_DATA_DIR=\"$PWD/.dev-data\" npm run dev"

[tasks."dev:sample:reset"]
description = "표본 데이터(.dev-data)를 처음 상태로 다시 만든다"
run = "node tools/dev-data/seed.cjs --reset"

[tasks.storybook]
description = "화면별 상태 검수"
run = "npm run storybook"

[tasks.build]
description = "릴리스 실행파일 빌드"
run = "npm run build"

[tasks."package:dir"]
description = "현재 운영체제 배포 폴더 생성"
run = "npm run desktop:dir"

[tasks.install]
description = "빌드 후 앱 메뉴·바탕화면 설치본 갱신"
depends = ["package:dir"]
run = "./integration/install.sh"

[tasks."check:secrets"]
description = "Git 전체 이력의 비밀정보 검사 (출력 마스킹)"
run = "gitleaks git --redact --no-banner"

[tasks."hooks:install"]
description = "커밋·푸시 전 Gitleaks 검사 활성화"
run = "git config --local core.hooksPath .githooks"

[tasks.check]
description = "SQLite 엔진 포맷·테스트·정적 검사"
run = [
    "cargo fmt --manifest-path engine/Cargo.toml --check",
    "mise run test:engine",
    "cargo clippy --manifest-path engine/Cargo.toml --locked -- -D warnings",
]

[tasks."test:engine"]
description = "데스크톱 SQLite 엔진"
run = "cargo test --manifest-path engine/Cargo.toml --locked"

[tasks."test:desktop"]
description = "Electron 통신과 종료"
run = "node --test desktop/*.test.cjs"

[tasks."test:web"]
description = "화면 순수 로직 단위 테스트 (Vitest)"
run = "npm run test:unit"

[tasks."test:stories"]
description = "Storybook 상호작용·접근성 (현재 코드로 정적 빌드 후 검사, 실행 중인 Storybook 불필요)"
run = "npm run test:stories"

[tasks."test:perf"]
description = "캔버스 조작 부드러움 (카드 200장: 이동·확대·드래그·가지 초점 프레임 예산, 헤드리스)"
run = "npm run test:perf"

[tasks."test:memory"]
description = "큰 캔버스 화면 전환·드래그 50회 후 GC 힙 회복 검사 (헤드리스)"
run = "npm run test:memory"

[tasks."test:e2e"]
description = "Electron 정합 작동: 합성 데이터로 작성·동기화·재시작 복원 (가상 X 화면, 사용자 화면에 창을 띄우지 않음)"
env = { MEMOIVY_HEADLESS = "1" }
run = "env -u WAYLAND_DISPLAY xvfb-run -a npm run test:e2e --"
# Windows에는 Wayland·xvfb가 없어 Electron을 바로 띄운다(CI windows 러너 전용 경로).
run_windows = "npm run test:e2e --"

[tasks."check:web"]
description = "웹·데스크톱 정적 점검: 린트, 미사용 코드, 모듈 경계, 중복"
run = ["npm run lint", "npm run check:unused", "npm run check:deps", "npm run check:dupes", "cargo machete engine"]
